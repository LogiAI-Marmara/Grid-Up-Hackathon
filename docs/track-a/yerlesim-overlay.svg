<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 1720 1660" width="100%" style="max-width:920px;background:#fff;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ff9800" stroke-width="1.6" opacity="0.45"/>
    </pattern>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d32f2f"/>
    </marker>
    <marker id="arw2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- PANO GÖVDESİ (1600 x 1500 mm) -->
  <rect x="0" y="0" width="1600" height="1500" fill="#fafafa" stroke="#37474f" stroke-width="6"/>
  <text x="800.0" y="-18" text-anchor="middle" font-size="30" font-weight="700" fill="#37474f">AG PANO İÇ GÖRÜNÜŞ — 1600 × 1500 mm (TEDAŞ-MLZ/2003-06.B, EK-II/14)</text>

  <!-- ÜST BÖLÜM: kontrol/haberleşme cihazları (üst ~1/3) -->
  <rect x="40" y="40" width="1520" height="420" fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="72" font-size="22" fill="#607d8b">Üst bölüm — kumanda / haberleşme (≈0–450 mm)</text>
  <rect x="120" y="110" width="210" height="150" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
  <text x="225" y="195" text-anchor="middle" font-size="19" fill="#37474f">Sct. Komp.</text>
  <rect x="1150" y="110" width="260" height="150" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
  <text x="1280" y="195" text-anchor="middle" font-size="19" fill="#37474f">Modem</text>
  <!-- Modem kutusu vurgusu: emsal -->
  <rect x="1144" y="104" width="272" height="162" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="1280" y="290" text-anchor="middle" font-size="16" fill="#2e7d32" font-style="italic">şartnamede hazır emsal: iç ihtiyaç devresinden beslenen cihaz</text>

  <!-- ORTA BÖLÜM: KLEMENS SIRALARI -->
  <rect x="40" y="500" width="1520" height="500" fill="url(#hatch)" stroke="#ff9800" stroke-width="3"/>
  <text x="60" y="535" font-size="24" font-weight="700" fill="#e65100">ÇIKIŞ KLEMENS SIRALARI — kritik bölge (≈500–1000 mm)</text>
  <text x="60" y="568" font-size="18" fill="#ef6c00">3–4 yatay sıra · besleme çıkışları · en yüksek arıza riski</text>
  <line x1="80" y1="610" x2="1520" y2="610" stroke="#e65100" stroke-width="14" opacity="0.55"/>
  <text x="1530" y="617" text-anchor="end" font-size="16" fill="#bf360c">sıra 1</text>
  <line x1="80" y1="700" x2="1520" y2="700" stroke="#e65100" stroke-width="14" opacity="0.55"/>
  <text x="1530" y="707" text-anchor="end" font-size="16" fill="#bf360c">sıra 2</text>
  <line x1="80" y1="790" x2="1520" y2="790" stroke="#e65100" stroke-width="14" opacity="0.55"/>
  <text x="1530" y="797" text-anchor="end" font-size="16" fill="#bf360c">sıra 3</text>
  <line x1="80" y1="880" x2="1520" y2="880" stroke="#e65100" stroke-width="14" opacity="0.55"/>
  <text x="1530" y="887" text-anchor="end" font-size="16" fill="#bf360c">sıra 4</text>

  <!-- ALT BÖLÜM -->
  <rect x="40" y="1010" width="1520" height="450" fill="#f5f5f5" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="1050" font-size="22" fill="#607d8b">Alt bölüm — kablo yönlendirme (şartname: "En az 400 mm" boşluk)</text>
  <line x1="80" y1="1440" x2="1520" y2="1440" stroke="#9e9e9e" stroke-width="3"/>
  <text x="120" y="1425" font-size="18" fill="#757575">taban / kablo girişi</text>

  <!-- TERMAL GÖRÜŞ KONİSİ -->
  <polygon points="760,750 840,750 1371.5,443.0 228.5,443.0"
           fill="#1565c0" opacity="0.20"/>
  <polygon points="760,750 840,750 1371.5,443.0 228.5,443.0"
           fill="none" stroke="#1565c0" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- KAPSAMA DİKDÖRTGENİ -->
  <rect x="228.5" y="443.0" width="1143" height="614"
        fill="none" stroke="#0d47a1" stroke-width="4"/>
  <text x="800" y="429.0" text-anchor="middle" font-size="21" font-weight="700" fill="#0d47a1">
    termal görüş alanı: 1143 × 614 mm (110°×75° @ 40 cm)
  </text>

  <!-- MODÜL KUTUSU -->
  <rect x="705" y="790" width="190" height="115" rx="8" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
  <text x="800" y="830" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">MODÜL</text>
  <text x="800" y="858" text-anchor="middle" font-size="15" fill="#c8e6c9">kapağa/din rayına</text>
  <text x="800" y="880" text-anchor="middle" font-size="15" fill="#c8e6c9">sabit · klemense DİK</text>

  <!-- BAKIŞ YÖNÜ OKU -->
  <line x1="800" y1="788" x2="800" y2="756" stroke="#d32f2f" stroke-width="5" marker-end="url(#arw)"/>
  <text x="816" y="780" font-size="19" font-weight="700" fill="#d32f2f">bakış yönü</text>

  <!-- MESAFE ÖLÇÜSÜ -->
  <line x1="980" y1="847" x2="1570" y2="847" stroke="#616161" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="985" y="840" font-size="17" fill="#616161">pano derinliği 450 mm → sensör-hedef ≈ 40 cm</text>

  <!-- ÖLÇÜ OKLARI -->
  <line x1="-30" y1="0" x2="-30" y2="1500" stroke="#455a64" stroke-width="2" marker-start="url(#arw2)" marker-end="url(#arw2)"/>
  <text x="-38" y="750.0" text-anchor="middle" font-size="22" fill="#455a64" transform="rotate(-90 -38 750.0)">1500 mm (B)</text>
  <line x1="0" y1="1540" x2="1600" y2="1540" stroke="#455a64" stroke-width="2" marker-start="url(#arw2)" marker-end="url(#arw2)"/>
  <text x="800.0" y="1578" text-anchor="middle" font-size="22" fill="#455a64">1600 mm (A)</text>

  <!-- LEJANT -->
  <rect x="1040" y="1600" width="540" height="150" fill="#fff" stroke="#b0bec5" stroke-width="2"/>
  <text x="1055" y="1630" font-size="19" font-weight="700" fill="#37474f">Lejant</text>
  <rect x="1060" y="1642" width="26" height="16" fill="#2e7d32"/>
  <text x="1095" y="1656" font-size="17" fill="#37474f">Modül (bu tasarım)</text>
  <rect x="1060" y="1668" width="26" height="16" fill="#1565c0" opacity="0.35"/>
  <text x="1095" y="1682" font-size="17" fill="#37474f">Termal görüş konisi</text>
  <rect x="1060" y="1694" width="26" height="16" fill="url(#hatch)" stroke="#ff9800"/>
  <text x="1095" y="1708" font-size="17" fill="#37474f">Klemens sıraları (kritik bölge)</text>
  <rect x="1060" y="1720" width="26" height="16" fill="none" stroke="#2e7d32" stroke-dasharray="5 3" stroke-width="2"/>
  <text x="1095" y="1734" font-size="17" fill="#37474f">Panoda mevcut cihaz (emsal)</text>
</svg>