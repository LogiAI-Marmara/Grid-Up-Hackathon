<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 2500 1830" width="100%" style="max-width:1100px;background:#fff;font-family:Arial,Helvetica,sans-serif">
  <!--
    Modül yerleşimi ve termal görüş hattı — TEDAŞ-MLZ/2003-06.B, EK-II/14 üzerine overlay.
    Ölçek: 1 birim = 1 mm. Sol: önden görünüş (A×B = 1600×1500). Sağ: yan kesit (C×B = 450×1500).
    Bölge sınırları TEDAŞ çiziminden orantıyla ölçülmüştür (±30 mm).
    Termal kapsama: 110°×75° @ ~40 cm  →  2·395·tan(55°) × 2·395·tan(37.5°) ≈ 1128 × 606 mm;
    doküman 40 cm için 1143 × 614 mm kullanır (karar kaydı §7.1: "kabaca 114 × 61 cm").
  -->
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ef6c00" stroke-width="1.5" opacity="0.5"/>
    </pattern>
    <pattern id="nh" width="100" height="120" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="84" height="104" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
      <rect x="30" y="20" width="40" height="80" fill="none" stroke="#e65100" stroke-width="1.5"/>
    </pattern>
    <pattern id="klm" width="100" height="55" patternUnits="userSpaceOnUse">
      <rect x="10" y="8" width="80" height="40" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
      <circle cx="50" cy="28" r="7" fill="none" stroke="#e65100" stroke-width="1.5"/>
    </pattern>
    <marker id="arw-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#c62828"/>
    </marker>
    <marker id="dim" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 z" fill="#455a64"/>
    </marker>
  </defs>

  <!-- ============ BAŞLIK ============ -->
  <text x="1160" y="-45" text-anchor="middle" font-size="34" font-weight="700" fill="#263238">Modül yerleşimi ve termal görüş hattı — 1600 kVA AG pano (TEDAŞ-MLZ/2003-06.B, EK-II/14)</text>

  <!-- ====================================================== -->
  <!-- SOL PANEL: ÖNDEN GÖRÜNÜŞ (kapak açık, iç yerleşim)      -->
  <!-- ====================================================== -->
  <g id="on-gorunus">
    <text x="800" y="-8" text-anchor="middle" font-size="24" font-weight="700" fill="#455a64">ÖNDEN GÖRÜNÜŞ — kapak açık (A × B = 1600 × 1500 mm)</text>

    <!-- pano gövdesi -->
    <rect x="0" y="0" width="1600" height="1500" fill="#fafafa" stroke="#263238" stroke-width="6"/>

    <!-- üst bölüm: kumanda / haberleşme -->
    <rect x="40" y="50" width="1520" height="415" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
    <text x="60" y="84" font-size="21" fill="#546e7a">Üst bölüm — kumanda / haberleşme (≈50–465 mm)</text>
    <rect x="90" y="300" width="150" height="150" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <text x="165" y="368" text-anchor="middle" font-size="18" fill="#37474f">Sbt.</text>
    <text x="165" y="392" text-anchor="middle" font-size="18" fill="#37474f">Komp.</text>
    <rect x="1290" y="360" width="200" height="90" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <text x="1390" y="412" text-anchor="middle" font-size="19" fill="#37474f">Modem</text>
    <rect x="1280" y="350" width="220" height="110" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="1390" y="335" text-anchor="middle" font-size="15" fill="#2e7d32" font-style="italic">emsal: iç ihtiyaçtan beslenen cihaz</text>

    <!-- sağ sütun: ölçü / kontrol -->
    <rect x="1290" y="530" width="270" height="540" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
    <rect x="1320" y="560" width="210" height="150" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <text x="1425" y="630" text-anchor="middle" font-size="17" fill="#37474f">T1 ölçü</text>
    <text x="1425" y="654" text-anchor="middle" font-size="17" fill="#37474f">(enerji analizörü)</text>
    <rect x="1320" y="760" width="210" height="110" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <text x="1425" y="822" text-anchor="middle" font-size="17" fill="#37474f">kontrol</text>
    <text x="1425" y="1040" text-anchor="middle" font-size="15" fill="#546e7a">ölçü / kontrol sütunu</text>

    <!-- kritik bölge: sigorta sıraları + klemens sırası (çizimden: x 50–1250, y 560–1060) -->
    <rect x="50" y="545" width="1200" height="530" fill="url(#hatch)" stroke="#ef6c00" stroke-width="3"/>
    <rect x="50" y="560" width="1200" height="120" fill="url(#nh)" stroke="#e65100" stroke-width="2"/>
    <rect x="50" y="695" width="1200" height="120" fill="url(#nh)" stroke="#e65100" stroke-width="2"/>
    <rect x="50" y="830" width="1200" height="120" fill="url(#nh)" stroke="#e65100" stroke-width="2"/>
    <rect x="50" y="1005" width="1200" height="55" fill="url(#klm)" stroke="#e65100" stroke-width="2"/>
    <text x="1262" y="625" font-size="15" fill="#bf360c">sıra 1</text>
    <text x="1262" y="760" font-size="15" fill="#bf360c">sıra 2</text>
    <text x="1262" y="895" font-size="15" fill="#bf360c">sıra 3</text>
    <text x="1262" y="1037" font-size="15" fill="#bf360c">klemens</text>
    <text x="60" y="493" font-size="21" font-weight="700" fill="#e65100">KRİTİK BÖLGE — NH sigortalı yük ayırıcı sıraları + çıkış klemensleri (≈560–1060 mm)</text>

    <!-- alt bölüm: kablo boşluğu -->
    <rect x="40" y="1080" width="1520" height="380" fill="#f5f5f5" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="700" y="1300" text-anchor="middle" font-size="21" fill="#607d8b">Alt bölüm — kablo yönlendirme boşluğu</text>
    <line x1="300" y1="1065" x2="300" y2="1455" stroke="#455a64" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="312" y="1265" font-size="17" fill="#455a64">"En az 400 mm" (şartname)</text>

    <!-- TERMAL KAPSAMA — modül merkezine ortalı dikdörtgen (1143 × 614) -->
    <rect x="78.5" y="503" width="1143" height="614" fill="#1565c0" opacity="0.13"/>
    <rect x="78.5" y="503" width="1143" height="614" fill="none" stroke="#0d47a1" stroke-width="4" stroke-dasharray="14 8"/>
    <rect x="620" y="1128" width="480" height="34" fill="#fff" opacity="0.9"/>
    <text x="860" y="1153" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">termal görüş alanı: 1143 × 614 mm (110°×75° @ ~40 cm)</text>

    <!-- MODÜL — kapak içindeki konumun bu düzleme izdüşümü (kesikli: ön düzlemde, kapak üzerinde) -->
    <rect x="600" y="775" width="100" height="70" rx="6" fill="#2e7d32" opacity="0.85" stroke="#1b5e20" stroke-width="3" stroke-dasharray="9 5"/>
    <line x1="630" y1="810" x2="670" y2="810" stroke="#fff" stroke-width="2"/>
    <line x1="650" y1="790" x2="650" y2="830" stroke="#fff" stroke-width="2"/>
    <circle cx="650" cy="810" r="9" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="705" y="765" width="330" height="92" fill="#fff" opacity="0.92" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="718" y="790" font-size="18" font-weight="700" fill="#1b5e20">MODÜL — kapak iç yüzünde</text>
    <text x="718" y="814" font-size="15" fill="#2e7d32">merkez (x, y) ≈ (650, 810) mm / ~100 × 70 mm</text>
    <text x="718" y="836" font-size="15" fill="#2e7d32">bakış: sayfaya dik (→ yan kesit) / klemense DİK</text>
    <text x="718" y="852" font-size="13" fill="#558b2f" font-style="italic">kesikli çizgi = ön düzlemde, kapağa bağlı</text>

    <!-- ölçü okları A, B -->
    <line x1="-40" y1="0" x2="-40" y2="1500" stroke="#455a64" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="-50" y="750" text-anchor="middle" font-size="22" fill="#455a64" transform="rotate(-90 -50 750)">B = 1500 mm</text>
    <line x1="0" y1="1545" x2="1600" y2="1545" stroke="#455a64" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="800" y="1580" text-anchor="middle" font-size="22" fill="#455a64">A = 1600 mm</text>
  </g>

  <!-- ====================================================== -->
  <!-- SAĞ PANEL: YAN KESİT (derinlik) — koninin ait olduğu yer -->
  <!-- ====================================================== -->
  <g id="yan-kesit" transform="translate(1810,0)">
    <text x="240" y="-8" text-anchor="middle" font-size="24" font-weight="700" fill="#455a64">YAN KESİT (C × B = 450 × 1500 mm)</text>

    <!-- gövde -->
    <rect x="0" y="0" width="450" height="1500" fill="#fafafa" stroke="#263238" stroke-width="6"/>
    <!-- arka montaj düzlemi -->
    <rect x="430" y="0" width="20" height="1500" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
    <text x="420" y="1478" text-anchor="end" font-size="14" fill="#546e7a">arka duvar / montaj plakası ▸</text>

    <!-- kapak (kapalı konum), menteşe altta -->
    <rect x="-22" y="0" width="22" height="1500" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
    <text x="-6" y="1400" font-size="15" fill="#37474f" transform="rotate(-90 -6 1400)" text-anchor="start">ön kapak (menteşe altta)</text>

    <!-- cihazlar arka duvarda -->
    <rect x="360" y="560" width="70" height="120" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <rect x="360" y="695" width="70" height="120" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <rect x="360" y="830" width="70" height="120" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <rect x="385" y="1005" width="45" height="55" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <rect x="345" y="545" width="90" height="530" fill="none" stroke="#ef6c00" stroke-width="3"/>
    <text x="335" y="1128" text-anchor="end" font-size="15" fill="#e65100" font-weight="700">kritik bölge</text>
    <rect x="380" y="300" width="50" height="150" fill="#cfd8dc" stroke="#78909c" stroke-width="2"/>
    <text x="370" y="380" text-anchor="end" font-size="14" fill="#546e7a">kumanda</text>

    <!-- modül kapak içinde: 35 mm derinlik, sensör yüzeyi x=35 -->
    <rect x="0" y="775" width="35" height="70" rx="4" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
    <circle cx="35" cy="810" r="6" fill="#ffeb3b" stroke="#1b5e20" stroke-width="2"/>
    <text x="17" y="765" text-anchor="middle" font-size="14" fill="#1b5e20" font-weight="700">MODÜL</text>
    <text x="55" y="770" font-size="13" fill="#1b5e20">IR pencere / sensör yuvası (dışa bakar)</text>

    <!-- görüş konisi: apex (35,810), 75° dikey, arka düzleme (x=430) → yarı yükseklik 395·tan(37.5°)=303 -->
    <polygon points="35,810 430,507 430,1113" fill="#1565c0" opacity="0.16"/>
    <polygon points="35,810 430,507 430,1113" fill="none" stroke="#0d47a1" stroke-width="3" stroke-dasharray="12 7"/>
    <line x1="35" y1="810" x2="430" y2="810" stroke="#0d47a1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="235" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#0d47a1">75° (dikey)</text>
    <text x="238" y="1165" text-anchor="middle" font-size="15" fill="#0d47a1">arka düzlemde 614 mm yükseklik</text>

    <!-- bakış yönü oku -->
    <line x1="45" y1="840" x2="150" y2="840" stroke="#c62828" stroke-width="5" marker-end="url(#arw-red)"/>
    <text x="100" y="870" text-anchor="middle" font-size="18" font-weight="700" fill="#c62828">bakış yönü</text>

    <!-- mesafe ölçüsü sensör → hedef -->
    <line x1="35" y1="1230" x2="430" y2="1230" stroke="#455a64" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="232" y="1220" text-anchor="middle" font-size="18" fill="#455a64">sensör → hedef ≈ 395 mm (~40 cm)</text>

    <!-- C ölçüsü -->
    <line x1="0" y1="1545" x2="450" y2="1545" stroke="#455a64" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <text x="225" y="1580" text-anchor="middle" font-size="22" fill="#455a64">C = 450 mm</text>
  </g>

  <!-- ============ LEJANT (viewBox içinde) ============ -->
  <g id="lejant" transform="translate(0,1610)">
    <rect x="0" y="0" width="2260" height="110" fill="#fff" stroke="#90a4ae" stroke-width="2"/>
    <text x="16" y="30" font-size="19" font-weight="700" fill="#263238">Lejant</text>

    <rect x="16" y="50" width="30" height="18" rx="3" fill="#2e7d32" stroke="#1b5e20" stroke-dasharray="6 3"/>
    <text x="56" y="65" font-size="17" fill="#37474f">Modül — kapak iç yüzünde (önden görünüşte izdüşüm, kesikli)</text>

    <rect x="16" y="78" width="30" height="18" fill="#1565c0" opacity="0.3" stroke="#0d47a1" stroke-dasharray="6 3"/>
    <text x="56" y="93" font-size="17" fill="#37474f">Termal görüş alanı (110°×75°, MLX90640 geniş açı) — önde kapsama dikdörtgeni, yanda koni</text>

    <rect x="900" y="50" width="30" height="18" fill="url(#nh)" stroke="#e65100"/>
    <text x="940" y="65" font-size="17" fill="#37474f">NH sigortalı yük ayırıcı sıraları + çıkış klemensleri (kritik bölge)</text>

    <rect x="900" y="78" width="30" height="18" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="940" y="93" font-size="17" fill="#37474f">Panoda hâlihazırda bulunan iç ihtiyaç beslemeli cihaz (emsal: Modem)</text>

    <text x="1620" y="65" font-size="15" fill="#607d8b">Bölge sınırları TEDAŞ çiziminden orantıyla ölçülmüştür (±30 mm).</text>
    <text x="1620" y="93" font-size="15" fill="#607d8b">1 birim = 1 mm. Kaynak: EK-II/14, sayfa 51.</text>
  </g>
</svg>
