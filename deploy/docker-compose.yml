# docker-compose.yml
# Grid Up Hackathon - İZ C: Uçtan Uca On-Premise Dağıtım Kompozisyonu (Madde 22)
# Tek komutla tüm zinciri ayağa kaldırır:
# Veritabanı, İZ A toplama ve simülatör, İZ B tarayıcı ve API, İZ C arayüz, Modbus ve alarm servisi.

services:
  # --------------------------------------------------------------------------
  # 1. VERİTABANI: PostgreSQL 16 (Merkezi Depo)
  # --------------------------------------------------------------------------
  veritabani:
    image: postgres:16-alpine
    container_name: gridup_db
    environment:
      - POSTGRES_DB=gridup
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=gridup
      - TZ=Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - gridup_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridup"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 2. İZ A: Toplama Servisi (POST /paket, Port: 8000)
  # --------------------------------------------------------------------------
  toplama:
    build:
      context: ../../repo/Grid-Up-Hackathon
      dockerfile: toplama/Dockerfile
    container_name: gridup_toplama
    environment:
      - TOPLAMA_KAYIT=postgres
      - DATABASE_URL=postgresql://postgres:gridup@veritabani:5432/gridup
      - TOPLAMA_HOST=0.0.0.0
      - TOPLAMA_PORT=8000
      - TZ=Europe/Istanbul
    ports:
      - "8000:8000"
    depends_on:
      veritabani:
        condition: service_healthy
      analiz_api:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 3. İZ B: Okuma API'si (Sözleşme ⑤, Port: 8080)
  # --------------------------------------------------------------------------
  analiz_api:
    build:
      context: ../..
      dockerfile: kodlar/deploy/Dockerfile.analiz
    image: deploy-analiz:latest
    container_name: gridup_analiz_api
    environment:
      - GRIDUP_ANALIZ_VERITABANI_DSN=postgresql://postgres:gridup@veritabani:5432/gridup
      - GRIDUP_ANALIZ_OLAY_HISTEREZIS_SN=31536000
      - TZ=Europe/Istanbul
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/saglik || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      veritabani:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 4. İZ B: Tarama Motoru (Anomali Dedektörü)
  # --------------------------------------------------------------------------
  analiz_tara:
    image: deploy-analiz:latest
    container_name: gridup_analiz_tara
    command: ["sh", "-c", "sleep 5 && python -m analiz tara --periyot 30"]
    environment:
      - GRIDUP_ANALIZ_VERITABANI_DSN=postgresql://postgres:gridup@veritabani:5432/gridup
      - GRIDUP_ANALIZ_OLAY_HISTEREZIS_SN=31536000
      - TZ=Europe/Istanbul
    depends_on:
      analiz_api:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 5. İZ C: Monitoring Web Arayüzü (Nginx, Port: 80)
  # --------------------------------------------------------------------------
  arayuz:
    build:
      context: ../arayuz
      dockerfile: Dockerfile
    container_name: gridup_arayuz
    ports:
      - "80:80"
    volumes:
      - ../arayuz:/usr/share/nginx/html:ro
    environment:
      - TZ=Europe/Istanbul
    depends_on:
      analiz_api:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 6. İZ C: SCADA Entegrasyonu için Modbus TCP Sunucusu (Port: 5020)
  # --------------------------------------------------------------------------
  modbus_server:
    build:
      context: ../modbus
      dockerfile: Dockerfile
    container_name: gridup_modbus
    ports:
      - "5020:5020"
    environment:
      - API_URL=http://analiz_api:8080
      - MODBUS_PORT=5020
      - MODBUS_HOST=0.0.0.0
      - TZ=Europe/Istanbul
    depends_on:
      analiz_api:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 7. İZ C: Anomali Geçiş Dinleyici & Alarm Servisi
  # --------------------------------------------------------------------------
  alarm_service:
    build:
      context: ../alarm
      dockerfile: Dockerfile
    container_name: gridup_alarm
    env_file:
      - .env
    environment:
      - API_URL=http://analiz_api:8080
      - COOLDOWN_SECONDS=300
      - POLL_INTERVAL=5
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TZ=Europe/Istanbul
    depends_on:
      analiz_api:
        condition: service_healthy
    networks:
      - gridup_network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # 8. İZ A: Modül Simülatörü (modul_sim -> POST /paket, süresiz)
  # --------------------------------------------------------------------------
  simulator:
    build:
      context: ../..
      dockerfile: kodlar/deploy/Dockerfile.sim
    container_name: gridup_simulator
    environment:
      - TOPLAMA_URL=http://toplama:8000/paket
      - SIM_MODUL_SAYISI=15
      - SIM_ARALIK_SN=3.0
      - TZ=Europe/Istanbul
    depends_on:
      toplama:
        condition: service_started
    networks:
      - gridup_network
    restart: unless-stopped

volumes:
  gridup_db_data:
    driver: local

networks:
  gridup_network:
    driver: bridge