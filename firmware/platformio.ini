; Grid-Up İZ A — modül firmware iskeleti (ESP32-S3-WROOM-1U-N8, 02-bom kalem 2).
;
; Derleme:  pio run            (bu klasörde)
; Yükleme:  pio run -t upload  (fiziksel modül yok; hackathon kapsamında yüklenmedi, §1.4)
;
; Wi-Fi / toplama adresi / modül kimliği build_flags ile verilir; kaynakta sır yok:
;   pio run -e modul -a '-DWIFI_SSID=\"saha\"' ...  ya da aşağıdaki build_flags satırını düzenle.

[env:modul]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    ; -DWIFI_SSID=\"...\" -DWIFI_SIFRE=\"...\" -DTOPLAMA_URL=\"http://gateway.local:8000/paket\" -DMODUL_ID=\"TR041-P01-M1\"
lib_deps =
    adafruit/Adafruit MLX90640@^1.1.1
    adafruit/Adafruit SHT31 Library@^2.2.2
    4-20ma/ModbusMaster@^2.0.1
