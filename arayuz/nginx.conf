server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /api/ {
        # Üst akış adı çalışma anında çözülür. Sabit `proxy_pass http://analiz_api:8080/`
        # adı Nginx açılışında bir kez çözer: analiz_api o an ayakta değilse Nginx
        # "host not found in upstream" ile hiç açılmaz (yeniden başlatma döngüsü),
        # ayaktaysa da konteyner yeniden oluşturulup IP değişince eski adrese 502
        # atmaya devam eder. 127.0.0.11 Docker'ın gömülü DNS'idir.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $analiz_api analiz_api;
        # /api/sahalar -> http://analiz_api:8080/sahalar (önek düşer)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$analiz_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
