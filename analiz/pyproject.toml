[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridup-analiz"
version = "0.1.0"
description = "Grid Up — track B, the analysis layer: scan loop, four-layer detector, anomaly event lifecycle."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
gridup-analiz = "analiz.__main__:main"

[tool.setuptools.packages.find]
include = ["analiz*"]

[tool.setuptools.package-data]
analiz = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
