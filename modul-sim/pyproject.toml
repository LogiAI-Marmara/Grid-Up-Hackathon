[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modul-sim"
version = "1.0.0"
description = "Grid-Up track A: synthetic module simulator (fault scenarios, thermal array, firmware threshold logic)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dogrula = ["jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modul_sim*"]